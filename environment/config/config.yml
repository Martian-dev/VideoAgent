llm:
  # All roles route to the Meta Model API (OpenAI SDK compatible).
  #   docs:   https://ai.developer.meta.com/docs
  #   models: muse-spark-1.3{,-contributor}, muse-spark-1.2{,-contributor}, muse-spark-1.1
  # NOTE: 1.3 is region-limited - EU hosts only see 1.2 and below. 1.2-contributor
  # is the portable default; export VIDEOAGENT_MODEL to override per deployment.
  # Leave api_key empty to fall back to the META_AI_API_KEY environment variable
  # (preferred - keeps keys out of git).
  #
  # Any *_model / *_api_key / *_base_url below overrides the shared value for that
  # role only; unset or empty entries inherit from the shared block. Point a single
  # role at a different provider by setting its own base_url + api_key.
  api_key: ""
  base_url: "https://api.meta.ai/v1"
  model: "muse-spark-1.2-contributor"

  # Video Remixing/TTS/SVC/Stand-up/CrossTalk
  deepseek_api_key: ""
  deepseek_base_url: ""
  deepseek_model: ""

  # Agentic Graph Router/TTS/SVC/Stand-up/CrossTalk
  claude_api_key: ""
  claude_base_url: ""
  claude_model: ""

  # Video Editing/Overview/Summarization/QA/Commentary Video
  gpt_api_key: ""
  gpt_base_url: ""
  gpt_model: ""

  # MLLM for caption and fine-grained video understanding
  gemini_api_key: ""
  gemini_base_url: ""
  gemini_model: ""
